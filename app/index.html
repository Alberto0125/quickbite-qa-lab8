<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBite QA</title><style>body{font:16px system-ui;max-width:760px;margin:36px auto;padding:0 20px;background:#f8fafc;color:#172033}button,input{padding:10px;margin:5px;border-radius:6px}button{background:#176bdb;color:white;border:0;cursor:pointer}.card{background:white;padding:20px;border-radius:12px;margin:15px 0}#message{font-weight:bold}</style></head><body><h1>🍔 QuickBite QA</h1><p>Entorno educativo de pruebas. Datos ficticios.</p><section class="card"><h2>Iniciar sesión</h2><input aria-label="Usuario" id="user" placeholder="Usuario"><input aria-label="Contraseña" id="password" type="password" placeholder="Contraseña"><button id="login">Ingresar</button><p id="login-result" role="status"></p></section><section class="card"><h2>Menú</h2><input aria-label="Buscar producto" id="search" placeholder="Buscar producto"><div id="products"></div><p>Carrito: <span id="cart-count">0</span> productos</p></section><section class="card"><h2>Finalizar pedido</h2><input aria-label="Nombre de entrega" id="customer" placeholder="Nombre de entrega"><button id="checkout">Confirmar pedido</button><p id="message" role="status"></p></section><script>const products=['Hamburguesa','Pizza','Ensalada','Tacos'];let cart=0;const render=()=>{const term=document.querySelector('#search').value.toLowerCase();document.querySelector('#products').innerHTML=products.filter(x=>x.toLowerCase().includes(term)).map(x=>`<p>${x} <button class="add" data-product="${x}">Agregar</button></p>`).join('')};document.querySelector('#search').addEventListener('input',render);document.querySelector('#products').addEventListener('click',e=>{if(e.target.classList.contains('add')){cart++;document.querySelector('#cart-count').textContent=cart}});document.querySelector('#login').addEventListener('click',()=>{const ok=document.querySelector('#user').value==='demo'&&document.querySelector('#password').value==='demo123';document.querySelector('#login-result').textContent=ok?'Bienvenido':'Credenciales incorrectas'});document.querySelector('#checkout').addEventListener('click',()=>{const name=document.querySelector('#customer').value.trim();document.querySelector('#message').textContent=cart===0?'Agregue productos al carrito':`Pedido confirmado para ${name||'Invitado'}`});render();</script></body></html>
